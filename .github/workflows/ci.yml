name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Check release version validation
        run: .\.github\scripts\Test-ReleaseVersion.ps1
      - name: Build
        run: dotnet build .\ZGott.Crestron.Logging.sln --configuration Release
      - name: Check API naming
        run: dotnet format style .\ZGott.Crestron.Logging.sln --verify-no-changes --diagnostics IDE1006 --severity warn --no-restore
      - name: Test
        run: dotnet test .\ZGott.Crestron.Logging.sln --configuration Release --no-build
      - name: Pack
        run: dotnet pack .\ZGott.Crestron.Logging\ZGott.Crestron.Logging.csproj --configuration Release --no-build --output .\artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: |
            artifacts\*.nupkg
            artifacts\*.snupkg
          if-no-files-found: error
